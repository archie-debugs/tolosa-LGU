<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SB Tolosa System QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style nonce="$nonce">
  :root {
    --blue: #1A56B5; --blue-dark: #0E3A86; --navy: #073a78; --primary: #0869d5; --accent: #ffda31;
    --canvas: #F2F6FC; --ink: #163f72; --muted: #617493; --border: #d6e1ee; --green: #1b7f3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #dde9fb 0%, var(--canvas) 60%); color: var(--ink);
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 440px; background: #fff; border-radius: 24px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(14, 58, 134, 0.18), 0 2px 6px rgba(14, 58, 134, 0.06);
  }
  .band {
    position: relative; padding: 28px 24px 56px; text-align: center; color: #fff;
    background: linear-gradient(180deg, rgba(26, 86, 181, 0.92), rgba(14, 58, 134, 0.96)), $building center / cover no-repeat, var(--blue-dark);
  }
  .seal {
    width: 88px; height: 88px; border-radius: 50%; background: #fff; padding: 4px; margin: 0 auto 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  .seal img { width: 100%; height: 100%; border-radius: 50%; display: block; transform: scale(1.08); }
  .eyebrow { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.85; }
  h1 { margin: 6px 0 0; font-size: 21px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.25; }
  .bar { width: 56px; height: 4px; border-radius: 2px; background: var(--accent); margin: 12px auto 10px; }
  .system { font-size: 14px; font-weight: 500; color: #c9dcf5; }
  .body { padding: 0 24px 24px; text-align: center; }
  .qr-frame {
    position: relative; margin: -36px auto 0; width: 256px; padding: 22px; background: #fff; border-radius: 20px;
    border: 1px solid var(--border); box-shadow: 0 10px 28px rgba(14, 58, 134, 0.14);
  }
  .qr-frame img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  .corner { position: absolute; width: 22px; height: 22px; border: 3px solid var(--primary); }
  .tl { top: 7px; left: 7px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
  .tr { top: 7px; right: 7px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
  .bl { bottom: 7px; left: 7px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
  .br { bottom: 7px; right: 7px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
  .scan { margin: 18px 0 4px; font-size: 16px; font-weight: 700; color: var(--navy); }
  .hint { margin: 0; font-size: 13px; color: var(--muted); }
  .link {
    display: flex; align-items: center; gap: 10px; margin: 18px 0 0; padding: 8px 8px 8px 14px;
    border: 1px solid var(--border); border-radius: 14px; background: #f7faff; text-align: left;
  }
  .link svg { flex: none; color: var(--primary); }
  .link span { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  button, a.btn {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 12px; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s, background .15s;
  }
  button:active, a.btn:active { transform: scale(0.98); }
  .copy-link { flex: none; border: 0; padding: 8px 12px; background: var(--primary); color: #fff; }
  .copy-link:hover { background: #0759b6; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  .actions .btn, .actions button { padding: 11px 8px; border: 1px solid var(--border); background: #fff; color: var(--ink); }
  .actions .btn:hover, .actions button:hover { background: #eef4fd; border-color: #b9cde6; }
  .actions .main { background: linear-gradient(180deg, #086bdc, #0561c9); border-color: transparent; color: #fff; }
  .actions .main:hover { background: linear-gradient(180deg, #0763cb, #0457b8); }
  .footer { padding: 14px 24px; border-top: 1px solid var(--border); background: #f9fbfe; font-size: 12px; color: var(--muted); text-align: center; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 380px) { .actions { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; border: 1px solid var(--border); }
    .actions, .copy-link, .toast { display: none !important; }
    .band { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main class="card">
  <header class="band">
    $seal
    <div class="eyebrow">Welcome to</div>
    <h1>Sangguniang Bayan of Tolosa, Leyte</h1>
    <div class="bar"></div>
    <div class="system">Document Tracking Management System</div>
  </header>
  <section class="body">
    <div class="qr-frame">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <img id="qr" src="qr.png" alt="QR code that opens $link">
    </div>
    <p class="scan">Scan to open the system</p>
    <p class="hint">Point your phone's camera at the code.</p>
    <div class="link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span id="link">$link</span>
      <button class="copy-link" id="copy-link" type="button">Copy</button>
    </div>
    <div class="actions">
      <button class="main" id="copy-qr" type="button">Copy QR</button>
      <a class="btn" href="qr.png" download="sb-tolosa-system-qr.png">Save</a>
      <button id="print" type="button">Print</button>
    </div>
  </section>
  <footer class="footer">Anyone with this code or link can open the system.</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script nonce="$nonce">
  function toast(text) {
    var t = document.getElementById("toast");
    t.textContent = text; t.classList.add("show");
    clearTimeout(window._toast); window._toast = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function copyLink() {
    var text = document.getElementById("link").textContent;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast("Link copied"); }, fallback);
    } else { fallback(); }
    function fallback() {
      var area = document.createElement("textarea"); area.value = text; document.body.appendChild(area); area.select();
      try { document.execCommand("copy"); toast("Link copied"); } catch (e) { toast("Select the link and copy it"); }
      area.remove();
    }
  }
  function copyImage() {
    if (!(navigator.clipboard && window.ClipboardItem && window.isSecureContext)) {
      toast("Right-click or press and hold the QR to copy it"); return;
    }
    var blob = fetch("qr.png").then(function (r) { return r.blob(); });
    navigator.clipboard.write([new ClipboardItem({"image/png": blob})])
      .then(function () { toast("QR image copied"); }, function () { toast("Right-click or press and hold the QR to copy it"); });
  }
  // Wired here, not with onclick attributes: the page's Content-Security-Policy refuses inline handlers.
  document.getElementById("copy-link").addEventListener("click", copyLink);
  document.getElementById("copy-qr").addEventListener("click", copyImage);
  document.getElementById("print").addEventListener("click", function () { window.print(); });
</script>
</body>
</html>
